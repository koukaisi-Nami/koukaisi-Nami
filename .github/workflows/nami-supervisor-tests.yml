name: Nami supervisor tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  supervisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile supervisor
        run: python -m py_compile nami_supervisor.py
      - name: Run supervisor regression tests
        run: python -m pytest -q test_nami_supervisor.py
