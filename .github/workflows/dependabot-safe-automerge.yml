name: Safe dependency auto update
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
jobs:
  dependency-gate:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the exact Dependabot candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and tests
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Compile production runtime
        run: >-
          python -m py_compile app.py
          nami_frontier.py nami_rag.py nami_openai_media.py nami_safety.py nami_router.py
          nami_evolution.py nami_memory_engine.py nami_evaluator.py nami_health.py
      - name: Full deterministic regression suite
        run: python -m pytest -q
      - name: Owner guard regression
        run: python -m unittest tests.test_owner_guard
      - name: Read Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Merge tested patch/minor update
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash "$PR_URL"
      - name: Hold major updates for owner review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "Major dependency update intentionally held for explicit review."
