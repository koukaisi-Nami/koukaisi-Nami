name: Apply scoped RAG and voice
on:
  push:
    branches: [chapi/nami-frontier-rag-voice]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply runtime patch
        run: python scripts/patch_rag_voice.py
      - name: Compile
        run: python -m py_compile app.py nami_rag.py nami_openai_media.py nami_frontier.py
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: RAG, frontier and safety regression
        run: >-
          python -m pytest -q
          tests/test_nami_rag.py
          tests/test_nami_frontier.py
          tests/test_nami_openai_media.py
          tests/test_nami_memory_engine.py
          tests/test_nami_context_budget.py
          tests/test_nami_safety.py
          tests/test_nami_evaluator_health.py
      - name: Owner guard regression
        run: python -m unittest tests.test_owner_guard
      - name: Runtime invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          s=Path('app.py').read_text(); ast.parse(s)
          assert 'CREATE TABLE IF NOT EXISTS memories' in s
          assert 'CREATE TABLE IF NOT EXISTS rag_stores' in s
          assert "(scope='user' AND scope_id=%s)" in s
          assert "(scope='conversation' AND scope_id=%s)" in s
          assert "(scope='company' AND scope_id='company')" in s
          assert 'max_results=4' in s
          assert "typ not in ('text','image','file','audio')" in s
          assert 'transcribe(rawvoice' in s
          assert 'start_rag_index_pdf(cid,uid,mid' in s
          assert 'awaiting and can_self_improve(uid)' in s
          forbidden=['DROP TABLE memories','TRUNCATE memories','DELETE FROM memories']
          upper=s.upper()
          assert all(x.upper() not in upper for x in forbidden)
          print('RAG/voice invariants OK')
          PY
      - name: Commit patched runtime
        run: |
          if git diff --quiet; then
            echo "No runtime patch needed"
            exit 0
          fi
          git config user.name "nami-rag-bot"
          git config user.email "nami-rag-bot@users.noreply.github.com"
          git add app.py
          git commit -m "Wire scoped hosted RAG and voice transcription"
          git push
