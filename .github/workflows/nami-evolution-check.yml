name: Nami Evolution Safety
on:
  pull_request:
    branches: [main]
  push:
    branches: [chapi/nami-2-upgrade]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m py_compile nami_evolution.py nami_update_manifest.py
      - run: python -m pytest -q tests/test_nami_evolution.py
