name: Apply frontier runtime
on:
  push:
    branches: [chapi/frontier-stack-final-live2]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply runtime patch
        run: python scripts/patch_frontier_runtime.py
      - name: Compile runtime and frontier modules
        run: >-
          python -m py_compile app.py nami_frontier.py nami_openai_media.py
          nami_model_policy.py nami_router.py nami_evolution.py nami_health.py
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run frontier and Nami 3.0 deterministic tests
        run: >-
          python -m pytest -q
          tests/test_nami_frontier.py
          tests/test_nami_openai_media.py
          tests/test_nami_model_policy.py
          tests/test_nami_context_budget.py
          tests/test_nami_router.py
          tests/test_nami_safety.py
          tests/test_nami_memory_engine.py
          tests/test_nami_evaluator_health.py
          tests/test_nami_evolution.py
      - name: Run owner guard tests
        run: python -m unittest tests.test_owner_guard
      - name: Runtime regression assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          s=Path('app.py').read_text()
          ast.parse(s)
          assert 'from nami_frontier import model_for_task, reasoning_for_task, task_for_text' in s
          assert 'from nami_openai_media import wants_image_generation, image_prompt, generate_image' in s
          assert 'runtime_model=model_for_task(runtime_task,OPENAI_KEY,HTTP)' in s
          assert 'model_for_task("self_improvement",OPENAI_KEY,HTTP)' in s
          assert 'model_for_task("code_review",OPENAI_KEY,HTTP)' in s
          assert 'model_for_task("document",OPENAI_KEY,HTTP)' in s
          assert 'OPENAI_VECTOR_STORE_ID' in s
          assert 'def start_frontier_image_generation(' in s
          assert 'wants_image_generation(text)' in s
          assert 'CREATE TABLE IF NOT EXISTS memories' in s
          assert 'awaiting and can_self_improve(uid)' in s
          print('frontier runtime invariants OK')
          PY
      - name: Commit patched runtime
        run: |
          if git diff --quiet; then
            echo "No runtime patch needed"
            exit 0
          fi
          git config user.name "nami-frontier-bot"
          git config user.email "nami-frontier-bot@users.noreply.github.com"
          git add app.py
          git commit -m "Wire frontier media and model routing into runtime"
          git push
