version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
      time: "03:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      safe-python-updates:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "03:20"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      safe-action-updates:
        update-types: [minor, patch]
