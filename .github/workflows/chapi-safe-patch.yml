name: Chapi one-shot safe patch
on:
  push:
    branches: [chapi-permission-test]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chapi-permission-test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch and syntax-check app.py
        run: python scripts/patch_openai_429.py
      - name: Remove one-shot patch machinery
        run: rm -f scripts/patch_openai_429.py .github/workflows/chapi-safe-patch.yml
      - name: Commit patched app.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve OpenAI 429 diagnostics" || exit 0
          git push origin HEAD:chapi-permission-test
