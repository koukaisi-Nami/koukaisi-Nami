name: Apply owner guard
on:
  push:
    branches: [security/owner-self-improve-lock]
    paths:
      - tools/apply_owner_guard.py
      - owner_guard.py
jobs:
  apply:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/owner-self-improve-lock
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_owner_guard.py
      - run: python -m py_compile app.py owner_guard.py
      - run: python -m unittest tests.test_owner_guard
      - name: Commit guarded app
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name nami-ci
          git config user.email nami-ci@users.noreply.github.com
          git add app.py
          git commit -m "Integrate owner-only self-improvement guard"
          git push origin HEAD:security/owner-self-improve-lock
