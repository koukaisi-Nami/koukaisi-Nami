name: Owner guard PR validation
on:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_owner_guard.py
      - run: python -m py_compile app.py owner_guard.py
      - run: python -m unittest tests.test_owner_guard
      - name: Ensure current runtime is owner guarded
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          required=(
              'from owner_guard import can_self_improve',
              "semantic_intent_route(text,uid,cid) if can_self_improve(uid) else 'chat'",
              'awaiting and can_self_improve(uid)',
              'elif owner_self_improve:',
          )
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('owner guard runtime markers missing: '+repr(missing))
          print('owner guard runtime markers OK')
          PY
