name: Chapi self improve repair
on:
  push:
    branches: [chapi-self-improve-fix]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chapi-self-improve-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch and syntax check
        run: python scripts/fix_self_improve.py
      - name: Remove one-shot repair files
        run: rm -f scripts/fix_self_improve.py .github/workflows/chapi-self-improve-fix.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair Nami GitHub self-improvement diagnostics"
          git push origin HEAD:chapi-self-improve-fix
