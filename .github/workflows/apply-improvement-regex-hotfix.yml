name: Apply improvement regex hotfix
on:
  push:
    branches: [chapi/hotfix-improvement-regex]
    paths:
      - 'scripts/hotfix_improvement_regex.py'
      - '.github/workflows/apply-improvement-regex-hotfix.yml'
jobs:
  hotfix:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chapi/hotfix-improvement-regex
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply regex fix
        run: python scripts/hotfix_improvement_regex.py
      - name: Compile and regression check
        run: |
          python -m py_compile app.py
          python - <<'PY'
          import ast, re
          src=open('app.py',encoding='utf-8').read()
          tree=ast.parse(src)
          fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='improvement_intent')
          call=fn.body[-1].value.args[0]
          search_call=call.args[0]
          pattern=ast.literal_eval(search_call.args[0])
          re.compile(pattern,re.I)
          assert re.search(pattern,'いい感じに改善しといて',re.I)
          print('regex compiles and improvement request matches')
          PY
      - name: Commit hotfix to branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Fix improvement intent regex runtime crash'
          git push
