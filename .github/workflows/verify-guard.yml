name: Verify rollback guard
on:
  push:
    branches: [chapi/post-deploy-safety-v2]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile app.py scripts/post_deploy_guard.py rollback_guard_check.py
      - run: python rollback_guard_check.py
