name: Apply Nami supervisor integration
on:
  push:
    branches: [chapi/nami-supervisor-education-loop]
    paths:
      - 'scripts/connect_nami_supervisor.py'
      - '.github/workflows/apply-nami-supervisor-integration.yml'
jobs:
  apply:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chapi/nami-supervisor-education-loop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wire supervisor without touching memory data
        run: python scripts/connect_nami_supervisor.py
      - name: Guard integration
        run: |
          python -m py_compile app.py nami_supervisor.py
          grep -q 'from nami_supervisor import' app.py
          grep -q 'def explicit_learning(text,uid,cid=None,source_type="user")' app.py
          grep -q 'taught=explicit_learning(text,uid,cid,source_type)' app.py
          grep -q 'if not can_self_improve(uid)' app.py
      - name: Run supervisor tests
        run: |
          python -m pip install pytest
          python -m pytest -q test_nami_supervisor.py
      - name: Preserve core behavior guards
        run: |
          python tools/apply_owner_guard.py
          python -m py_compile app.py owner_guard.py
          python -m unittest tests.test_owner_guard
      - name: Commit app integration to PR branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Wire memory-safe supervisor routing into Nami runtime'
          git push
