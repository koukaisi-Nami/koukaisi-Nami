name: Test multi-property estimates
on:
  push:
    branches: [chapi-multi-property-estimates]
  pull_request:
    paths: [multi_property_estimate.py, test_multi_property_estimate.py, app.py, patch_multi_property_integration.py]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest
      - run: python patch_multi_property_integration.py
      - run: python -m py_compile app.py multi_property_estimate.py
      - run: pytest -q test_multi_property_estimate.py
      - name: Commit integrated app
        if: github.event_name == 'push'
        run: |
          git config user.name 'chapi-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet || git commit -m 'Integrate multi-property estimate batches into LINE webhook'
          git push
