name: Nami safety kernel
on:
  pull_request:
    branches: [main]
  push:
    branches: [chapi/nami-2-upgrade]
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic safety tests
        run: python -m unittest tests/test_nami_safety.py
      - name: Compile safety kernel
        run: python -m py_compile nami_safety.py
