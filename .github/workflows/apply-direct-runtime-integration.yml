name: Apply direct structured runtime
on:
  push:
    branches: [fix/direct-runtime-integration]
    paths:
      - '.github/workflows/apply-direct-runtime-integration.yml'
jobs:
  apply:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-runtime-integration
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply integration to real app.py
        run: python scripts/connect_structured_estimates.py
      - name: Guard direct integration
        run: |
          grep -q 'from structured_estimate_runtime import generate_text as structured_estimate' app.py
          grep -q 'estimate_data,estimate_text=structured_estimate' app.py
          grep -q "ESTIMATE_CACHE\[key\]=(time.time(),estimate_data)" app.py
          python -m py_compile app.py structured_estimate_runtime.py estimate_model.py estimate_document.py
      - name: Run estimate regression tests
        run: |
          pip install reportlab pymupdf psycopg[binary] flask requests
          python -m unittest tests.test_estimate_model tests.test_estimate_renderer -v
          python - <<'PY'
          from structured_estimate_runtime import generate_text
          def fake_ai(prompt, uid, cid):
              return '{"property":"TEST 101","move_in":"15日","items":[{"key":"current_rent","label":"当月前家賃","amount":50000,"breakdown":"日割り16日分"},{"key":"brokerage","label":"仲介手数料","original_amount":110000,"discount_amount":55000,"amount":55000,"breakdown":"半額"}],"notes":[]}'
          data,text=generate_text(fake_ai,'15日入居、仲介半額','募集図面', 'u','c','TEST 101')
          assert data['total']==105000
          assert '日割り16日分' in text
          assert '割引55,000円' in text
          PY
      - name: Commit actual app.py
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Wire structured estimates directly into app runtime'
          git push
