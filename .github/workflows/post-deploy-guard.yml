name: Post deploy guard
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: nami-production-guard
  cancel-in-progress: false
jobs:
  verify-production:
    # Prevent an automatic revert commit from recursively reverting itself.
    if: ${{ !startsWith(github.event.head_commit.message, 'Revert ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight guard tests
        run: |
          python -m py_compile app.py scripts/post_deploy_guard.py
          python - <<'PY'
          s=open('scripts/post_deploy_guard.py').read()
          assert "git','revert','--no-edit'" in s
          assert 'DROP TABLE' not in s.upper()
          assert 'DELETE FROM MEMORIES' not in s.upper()
          assert 'LINE_CHANNEL_ACCESS_TOKEN' in s and 'NAMI_OWNER_LINE_USER_ID' in s
          print('post-deploy guard preflight OK')
          PY
      - name: Verify production and rollback on failure
        env:
          NAMI_HEALTH_URL: https://koukaisi-nami.onrender.com/
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          NAMI_OWNER_LINE_USER_ID: ${{ secrets.NAMI_OWNER_LINE_USER_ID }}
        run: python scripts/post_deploy_guard.py
