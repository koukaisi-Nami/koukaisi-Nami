name: Apply self improve resilience
on:
  push:
    branches: [chapi/self-improve-resilience-v1]
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {ref: chapi/self-improve-resilience-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Apply patch
        run: python scripts/patch_self_improve_resilience.py
      - name: Runtime compile and structural regression
        run: |
          python -m py_compile app.py
          python - <<'PY'
          import ast
          s=open('app.py').read(); tree=ast.parse(s)
          assert 'for generation_attempt in range(1,4)' in s
          assert 'max_output_tokens":4000' in s
          assert '変更案生成を3回試したが完了できなかった' in s
          assert 'targeted_candidate(req_text,current,feedback)' in s
          assert 'DELETE FROM memories' not in s.upper()
          assert 'DROP TABLE' not in s.upper()
          # No merge is introduced into generation/review path.
          a=s.index('def targeted_candidate('); b=s.index('def create_pr(',a)
          assert 'merge_pr(' not in s[a:b]
          # Regex must execute, not merely compile the file.
          ns={}; mod=ast.Module(body=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='improvement_intent'],type_ignores=[])
          exec(compile(mod,'<intent>','exec'),{'re':__import__('re')},ns)
          ns['improvement_intent']('ナミ、改善して')
          print('structural checks OK')
          PY
      - name: Existing regression suites
        run: |
          python -m pip install -q pytest
          pytest -q test_nami_supervisor.py tests/test_supervisor_review_runtime.py
          python -m unittest tests.test_owner_guard
      - name: Commit runtime patch
        run: |
          if git diff --quiet -- app.py; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          git commit -m 'Retry empty self-improvement code generation safely'
          git push
