name: Apply group behavior fix
on:
  push:
    branches: [chapi-group-behavior-fix]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python patch_group_behavior_fix.py
      - run: python -m py_compile app.py
      - run: |
          grep -q 'if grouped(e) and not called(m):' app.py
          grep -q 'Group safety: Nami is silent unless explicitly called/mentioned' app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          marker='if grouped(e) and not called(m):'
          block=s[s.index(marker):s.index(marker)+180]
          assert 'manager_review' not in block
          assert 'continue' in block
          PY
      - name: Commit app integration
        run: |
          git config user.name Chapi
          git config user.email actions@users.noreply.github.com
          git add app.py
          git diff --cached --quiet || git commit -m 'Keep Nami silent on unaddressed group chatter'
          git push
