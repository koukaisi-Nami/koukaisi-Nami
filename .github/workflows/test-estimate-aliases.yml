name: Test estimate aliases
on:
  pull_request:
    paths:
      - 'multi_property_estimate.py'
      - 'tests/test_estimate_aliases.py'
  push:
    branches: [chapi-insurance-detection-fix]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile multi_property_estimate.py
      - run: python tests/test_estimate_aliases.py
