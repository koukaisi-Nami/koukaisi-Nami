name: Apply conversation continuation
on:
  push:
    branches: [chapi-conversation-continuation]
    paths: [patch_conversation_continuation.py, continuation_trigger.txt]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: chapi-conversation-continuation}
      - run: python patch_conversation_continuation.py
      - run: python -m py_compile app.py
      - run: grep -q 'Natural continuation' app.py
      - name: Commit applied app
        run: |
          git config user.name Chapi
          git config user.email actions@users.noreply.github.com
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Allow natural follow-up messages without repeated Nami mention'
          git push origin HEAD:chapi-conversation-continuation
